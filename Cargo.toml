[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossbeam = "0.8.4"
ed25519-dalek = { version = "3", features = ["pkcs8", "pem"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"
# Pinned exactly: a young crate on our hot path. 0.5.0 is the first release that
# caps a message's inflated size at `max_payload_read`; 0.4.x accepts any size.
yawc = { version = "=0.5.0", default-features = false }

[dev-dependencies]
hyper = { version = "1", features = ["server"] }
log = "0.4"
tokio = { version = "1", features = ["test-util"] }
tracing-log = "0.2"
wiremock = "0.6"

[[test]]
name = "writer_stdout_pipe"
harness = false

# A panic anywhere ends the process, so no task dies unnoticed; run.sh
# restarts it. Dev and test builds unwind, since tests join panicked tasks.
[profile.release]
panic = "abort"

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
