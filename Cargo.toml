[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossbeam = "0.8.4"
ed25519-dalek = { version = "3", features = ["pkcs8", "pem"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
log = "0.4"
tokio = { version = "1", features = ["test-util"] }
tracing-log = "0.2"
wiremock = "0.6"

[[test]]
name = "writer_stdout_pipe"
harness = false

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
